<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051b11" />
      <stop offset="60%" stop-color="#092d1d" />
      <stop offset="100%" stop-color="#0f5132" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#051b11" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Deep Dark Mining Background -->
  <rect width="1200" height="400" fill="url(#bgDarkGrad)" />
  <rect width="1200" height="400" fill="url(#gridPattern)" />

  <!-- Mountain Coal Layers in Distance -->
  <path d="M 0 320 Q 250 240 500 290 T 950 250 Q 1100 280 1200 260 L 1200 400 L 0 400 Z" fill="#04150e" opacity="0.8" />
  <path d="M 0 350 Q 300 300 650 340 T 1200 320 L 1200 400 L 0 400 Z" fill="#020d09" opacity="0.95" />

  <!-- Excavator DX530 / PC2000 Silhouette on the left -->
  <g transform="translate(60, 160)" fill="#10b981" opacity="0.32">
    <!-- Tracks -->
    <rect x="70" y="160" width="160" height="35" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="2" />
    <circle cx="85" cy="177" r="10" fill="#34d399" />
    <circle cx="115" cy="177" r="10" fill="#34d399" />
    <circle cx="150" cy="177" r="10" fill="#34d399" />
    <circle cx="185" cy="177" r="10" fill="#34d399" />
    <circle cx="215" cy="177" r="10" fill="#34d399" />
    <!-- Cabin body -->
    <path d="M 90 160 L 90 100 Q 110 85 160 85 L 205 85 L 210 160 Z" fill="#064e3b" stroke="#34d399" stroke-width="2" />
    <!-- Boom & Arm -->
    <path d="M 170 110 L 260 20 L 370 70 L 390 130" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Bucket -->
    <path d="M 370 70 L 400 110 L 380 145 L 350 125 Z" fill="#34d399" />
    <!-- Hydraulic Cylinder -->
    <line x1="180" y1="130" x2="280" y2="40" stroke="#f59e0b" stroke-width="5" />
  </g>

  <!-- Giant Mining Dump Truck Silhouette on the right -->
  <g transform="translate(860, 175)" fill="#10b981" opacity="0.30">
    <!-- Dump Truck Bed -->
    <path d="M 40 50 L 190 20 L 210 120 L 40 120 Z" fill="#064e3b" stroke="#34d399" stroke-width="2" />
    <!-- Cab -->
    <path d="M 215 65 L 265 65 L 275 120 L 215 120 Z" fill="#064e3b" stroke="#34d399" stroke-width="2" />
    <!-- Tires -->
    <circle cx="85" cy="140" r="32" fill="#0f172a" stroke="#34d399" stroke-width="4" />
    <circle cx="85" cy="140" r="15" fill="#f59e0b" />
    <circle cx="240" cy="140" r="32" fill="#0f172a" stroke="#34d399" stroke-width="4" />
    <circle cx="240" cy="140" r="15" fill="#f59e0b" />
    <!-- Exhaust & Canopy -->
    <rect x="205" y="45" width="75" height="10" rx="3" fill="#f59e0b" />
  </g>

  <!-- Atmospheric Glow in Center for Logo -->
  <ellipse cx="600" cy="180" rx="350" ry="160" fill="url(#glowGrad)" />

  <!-- Subdued Lighting Poles / Mining Floodlights -->
  <line x1="380" y1="200" x2="380" y2="340" stroke="#f59e0b" stroke-width="2" opacity="0.4" />
  <circle cx="380" cy="200" r="6" fill="#fef08a" opacity="0.8" />
  <polygon points="380,200 300,340 460,340" fill="#fef08a" opacity="0.08" />

  <line x1="820" y1="200" x2="820" y2="340" stroke="#f59e0b" stroke-width="2" opacity="0.4" />
  <circle cx="820" cy="200" r="6" fill="#fef08a" opacity="0.8" />
  <polygon points="820,200 740,340 900,340" fill="#fef08a" opacity="0.08" />
</svg>
