<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="lcmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5132" />
      <stop offset="100%" stop-color="#198754" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  
  <!-- Emblem Hexagon / Shield -->
  <g transform="translate(15, 12)">
    <polygon points="45,5 85,28 85,72 45,95 5,72 5,28" fill="url(#lcmGrad)" stroke="#F59E0B" stroke-width="3" />
    <!-- Mining pickaxe & Coal layer icon -->
    <path d="M 28 35 L 62 65 M 62 35 L 28 65" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <circle cx="45" cy="50" r="10" fill="url(#goldGrad)" />
    <path d="M 32 75 L 58 75" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Company Name & Site Info -->
  <g transform="translate(125, 38)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#0F5132" letter-spacing="1.5">
      PT. LAZ COAL MANDIRI
    </text>
    <text x="0" y="24" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#D97706" letter-spacing="2">
      SITE ARUTMIN INDONESIA - KINTAP, KALSEL
    </text>
    <text x="0" y="44" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#64748B">
      Mining Contractor & Heavy Equipment Operations
    </text>
  </g>
</svg>
